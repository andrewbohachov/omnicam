[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicam"
version = "0.1.0"
description = "Turn any smartphone into a wireless Linux webcam (zero apps on phone, clean video only)."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Andrew Bohachov" }
]
dependencies = [
    "aiohttp>=3.9.0",
    "aiortc>=1.9.0",
    "av>=12.0.0",
    "cryptography>=42.0.0",
    "qrcode>=7.4.0",
]

[project.scripts]
omnicam = "omnicam.cli:main"
