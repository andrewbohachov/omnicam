<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OmniCam // Wireless Linux Webcam</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- Fullscreen Camera Preview -->
  <video id="preview" autoplay playsinline muted></video>

  <!-- Top Status Bar -->
  <div class="top-bar">
    <div class="badge" id="status-badge">
      <span class="dot"></span>
      <span id="status-text">READY</span>
    </div>

    <div class="top-right">
      <div class="stats" id="stats-hud">
        <span id="stat-res">1080p</span> • <span id="stat-fps">30 FPS</span>
      </div>
      <button id="lang-btn" class="lang-pill" title="Switch Language / Сменить язык">EN</button>
    </div>
  </div>

  <!-- Bottom Floating Control Panel -->
  <div class="controls-panel">
    <div class="quick-settings">
      <select id="res-select">
        <option value="1080" selected>1080p (Full HD)</option>
        <option value="720">720p (HD)</option>
      </select>

      <select id="fps-select">
        <option value="30" selected>30 FPS</option>
        <option value="60">60 FPS</option>
      </select>

      <button id="flip-btn" title="Flip Camera" class="icon-btn" aria-label="Flip Camera">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
      </button>
      <button id="torch-btn" title="Torch" class="icon-btn" style="display: none;" aria-label="Torch">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </button>
    </div>

    <button id="stream-btn" class="main-btn">
      <span class="btn-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      </span>
      <span id="btn-label">START STREAM</span>
    </button>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
